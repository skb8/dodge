name: Build OrangeFox dodge image

on:
  push:
    branches: [fox_14.1]
  pull_request:
    branches: [fox_14.1]
  workflow_dispatch:
    inputs:
      source_driver:
        description: Build WLAN modules from the full official OnePlus 13 source manifest
        type: boolean
        default: true

# An explicit bash shell enables pipefail for build-script | tee pipelines.
defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Host Wi-Fi tests (ASan and UBSan, including real control sockets)
        run: scripts/test-wifi.sh
      - name: Build error propagation and cache validation regressions
        run: python3 -m unittest discover -s tests -p 'test_build_*.py' -v
      - name: Native recovery adapter syntax
        run: python3 scripts/check-native-syntax.py
      - name: Compile Python build helpers
        run: python3 -m compileall -q scripts
      - name: Verify source patches against clean upstream checkouts
        run: |
          git clone --depth=1 -b fox_14.1 https://gitlab.com/OrangeFox/bootable/recovery.git /tmp/recovery
          git -C /tmp/recovery fetch --depth=1 origin bcff7d6e9ee6f80387d1b036c0f9e58216053b69
          git -C /tmp/recovery checkout --detach FETCH_HEAD
          git -C /tmp/recovery apply --check "$GITHUB_WORKSPACE/patches/orangefox-wifi.patch"
          git clone --depth=1 -b android-14.0.0_r1 https://android.googlesource.com/platform/external/wpa_supplicant_8 /tmp/wpa
          git -C /tmp/wpa apply --check "$GITHUB_WORKSPACE/patches/wpa-recovery.patch"

  oneplus-wlan:
    needs: validate
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.source_driver)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Resolve immutable official OnePlus source revisions
        id: source-lock
        run: |
          python3 scripts/lock-oneplus-source.py "$RUNNER_TEMP/oneplus-manifest" "$GITHUB_WORKSPACE/.source-lock"
          echo "manifest-revision=$(cat .source-lock/manifest-revision)" >> "$GITHUB_OUTPUT"
      - name: Restore exact source-built WLAN package
        id: wlan-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            wifi/modules
            artifacts/oneplus-kernel-manifest.xml
          key: ${{ runner.os }}-oneplus13-wlan-v1-${{ hashFiles('.source-lock/oneplus_13_b.xml', 'scripts/build-oneplus-wifi.sh', 'scripts/collect-wifi-modules.py', 'scripts/lock-oneplus-source.py', 'scripts/check-wlan-cache.py') }}
      - name: Free runner space
        if: steps.wlan-cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h
      - name: Add build swap
        if: steps.wlan-cache.outputs.cache-hit != 'true'
        run: |
          sudo fallocate -l 8G /mnt/dodge-build.swap
          sudo chmod 600 /mnt/dodge-build.swap
          sudo mkswap /mnt/dodge-build.swap
          sudo swapon /mnt/dodge-build.swap
      - name: Install kernel build dependencies
        if: steps.wlan-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y repo bc bison flex build-essential libssl-dev libelf-dev dwarves lz4 zstd python3 cpio rsync kmod
          git config --global user.name 'Recovery builder'
          git config --global user.email 'recovery-builder@users.noreply.github.com'
      - name: Sync full OnePlus source and build matching WLAN dependency closure
        if: steps.wlan-cache.outputs.cache-hit != 'true'
        env:
          ONEPLUS_MANIFEST_REVISION: ${{ steps.source-lock.outputs.manifest-revision }}
          ONEPLUS_LOCKED_MANIFEST: ${{ github.workspace }}/.source-lock/oneplus_13_b.xml
        run: scripts/build-oneplus-wifi.sh "$RUNNER_TEMP/oneplus13-kernel" 2>&1 | tee kernel-build.log
      - name: Verify WLAN package and source-lock match
        run: python3 scripts/check-wlan-cache.py .source-lock/oneplus_13_b.xml artifacts/oneplus-kernel-manifest.xml wifi/modules
      - name: Save exact source-built WLAN package
        if: steps.wlan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            wifi/modules
            artifacts/oneplus-kernel-manifest.xml
          key: ${{ steps.wlan-cache.outputs.cache-primary-key }}
      - name: Upload source-built WLAN modules and pinned manifest
        uses: actions/upload-artifact@v4
        with:
          name: oneplus13-source-wlan-${{ github.sha }}
          path: |
            wifi/modules/
            artifacts/oneplus-kernel-manifest.xml
          if-no-files-found: error
          retention-days: 14
      - name: Upload kernel diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneplus13-kernel-log-${{ github.sha }}
          path: kernel-build.log
          retention-days: 7

  recovery:
    needs: [validate, oneplus-wlan]
    if: >-
      always() && needs.validate.result == 'success' &&
      (needs.oneplus-wlan.result == 'success' || needs.oneplus-wlan.result == 'skipped') &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      USE_CCACHE: '1'
      CCACHE_EXEC: /usr/bin/ccache
      CC_WRAPPER: /usr/bin/ccache
      CXX_WRAPPER: /usr/bin/ccache
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache/recovery
      CCACHE_BASEDIR: ${{ github.workspace }}/android
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/checkout@v4
        with:
          path: device-tree
      - name: Free runner space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h
      - name: Add build swap
        run: |
          sudo fallocate -l 8G /mnt/dodge-build.swap
          sudo chmod 600 /mnt/dodge-build.swap
          sudo mkswap /mnt/dodge-build.swap
          sudo swapon /mnt/dodge-build.swap
      - name: Install recovery build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y repo bc bison flex build-essential zip curl git libssl-dev libelf-dev libxml2-utils xsltproc fontconfig lz4 zstd cpio rsync unzip python3 ccache
          git config --global user.name 'Recovery builder'
          git config --global user.email 'recovery-builder@users.noreply.github.com'
      - name: Restore recovery compiler cache
        id: recovery-ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-dodge-recovery-ccache-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-dodge-recovery-ccache-v1-
      - name: Configure compiler cache
        id: ccache-config
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --max-size "$CCACHE_MAXSIZE"
          ccache --zero-stats
      - name: Download source-built WLAN modules
        if: needs.oneplus-wlan.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: oneplus13-source-wlan-${{ github.sha }}
          path: source-wlan
      - name: Sync OrangeFox 14.1
        run: |
          git clone https://gitlab.com/OrangeFox/sync.git "$RUNNER_TEMP/fox-sync"
          git -C "$RUNNER_TEMP/fox-sync" checkout 03434a833701f73430cd085738ae0bf54f2231f1
          cd "$RUNNER_TEMP/fox-sync"
          ./orangefox_sync.sh --branch 14.1 --path "$GITHUB_WORKSPACE/android"
      - name: Install this exact device-tree commit and pinned native sources
        run: |
          mkdir -p android/device/oneplus/dodge
          rsync -a --exclude=.git device-tree/ android/device/oneplus/dodge/
          if [ -d source-wlan/wifi/modules ]; then
            mkdir -p android/device/oneplus/dodge/wifi/modules
            cp -a source-wlan/wifi/modules/. android/device/oneplus/dodge/wifi/modules/
          fi
          git -C android/bootable/recovery fetch --depth=1 origin bcff7d6e9ee6f80387d1b036c0f9e58216053b69
          git -C android/bootable/recovery checkout --detach FETCH_HEAD
          android/device/oneplus/dodge/scripts/sync-wifi-deps.sh "$GITHUB_WORKSPACE/android"
          git -C android/external/wpa_supplicant_8 fetch --depth=1 https://android.googlesource.com/platform/external/wpa_supplicant_8 5c473a2f2e6f8fda0f8334e75b66a2c203bf8695
          git -C android/external/wpa_supplicant_8 checkout --detach FETCH_HEAD
      - name: Build and verify recovery.img
        run: android/device/oneplus/dodge/scripts/build-recovery.sh "$GITHUB_WORKSPACE/android" 2>&1 | tee recovery-build.log
      - name: Upload flashable image, checksum and source manifest
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-dodge-${{ github.sha }}
          path: |
            android/device/oneplus/dodge/artifacts/OrangeFox-dodge.img
            android/device/oneplus/dodge/artifacts/SHA256SUMS
            android/device/oneplus/dodge/artifacts/recovery-manifest.xml
          if-no-files-found: error
          retention-days: 14
      - name: Compiler cache statistics
        if: ${{ !cancelled() && steps.ccache-config.outcome == 'success' }}
        run: ccache --show-stats
      - name: Save recovery compiler cache, including completed work from failed builds
        if: ${{ !cancelled() && steps.ccache-config.outcome == 'success' && steps.recovery-ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.recovery-ccache.outputs.cache-primary-key }}
      - name: Upload recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-build-log-${{ github.sha }}
          path: |
            recovery-build.log
            android/out/soong/soong.log
          retention-days: 7
